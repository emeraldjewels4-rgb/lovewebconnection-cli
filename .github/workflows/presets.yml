name: Preset health

# Probes the built-in chain endpoints on a schedule. The test suite runs offline
# on purpose, so nothing else notices when a public provider starts failing.
# Runs by hand use the same path.

on:
  schedule:
    # 06:17 UTC daily, ahead of the working day in Europe and the US.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      fail_under:
        description: Minimum uptime percentage over the window
        required: false
        default: "95"

permissions:
  contents: read

concurrency:
  group: preset-health
  cancel-in-progress: true

jobs:
  probe:
    name: lwc presets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Overridable by hand; 95% leaves room for one bad run in twenty while
      # still catching a provider that has been flaky all week.
      FAIL_UNDER: ${{ github.event.inputs.fail_under || '95' }}
      FAIL_WINDOW: 7d
      # A file nobody has appended to cannot vouch for today, however healthy
      # its last runs were: a week matches the window the gate judges.
      MAX_AGE: 7d
      # How many recent runs the freshness table lists when the history is
      # stale; five fits the summary without hiding that the file stopped.
      FRESHNESS_ROWS: 5
      # The same span immediately before FAIL_WINDOW, so each run publishes
      # this week's uptime beside the week it replaced.
      COMPARE_WINDOW: 14d..7d
      # The release is the durable copy, not an unbounded one: cap the merged
      # history at six months, which still leaves month-over-month windows.
      RETAIN_WINDOW: 180d

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      # Cache entries are immutable, so each run restores the newest entry by
      # prefix and saves its own: the file accumulates across runs. GitHub evicts
      # entries unused for a week, which only shortens the trend, not the check.
      - name: Restore the health history
        uses: actions/cache@v4
        with:
          path: .lwc-history
          key: preset-health-${{ github.run_id }}
          restore-keys: |
            preset-health-

      # The cache is fast but short-lived: an entry idle for a week is evicted,
      # and a paused schedule would lose the trend. The release asset is the
      # durable copy, so a month of runs keeps a month of comparisons.
      - name: Restore the durable history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cached=.lwc-history/presets.jsonl
          durable=.lwc-history/durable.jsonl
          rm -f "$durable"
          if ! gh release download preset-history --pattern presets.jsonl --output "$durable" --clobber; then
            echo "no durable history yet; the cache is all there is"
            exit 0
          fi
          if [ ! -s "$durable" ]; then
            echo "the durable copy is empty; keeping the cache"
            exit 0
          fi
          # Either copy can be missing runs the other still has: a fresh cache
          # starts empty and a cache entry is evicted after a week without use.
          # Restore their union, so a gap in one copy cannot shrink the window
          # the gate judges, then let the probe append this run to it.
          node scripts/presets-history-merge.mjs "$cached" "$cached" "$durable" \
            --retain "$RETAIN_WINDOW" \
            || echo "::warning::could not merge the cache and the release; gating on the cache as restored"
          rm -f "$durable"

      # The command already exits 1 when any endpoint is unhealthy, so its status
      # is the verdict. It is captured instead of aborting the step, so the
      # summary of a failed run is still written.
      - name: Probe every built-in preset
        run: |
          set -uo pipefail
          status=0
          node src/cli.ts presets --json --history .lwc-history/presets.jsonl > presets.json || status=$?

          # The summary names any endpoint that fell back to its backup and
          # annotates each failover, so a backup taking over shows up in the run
          # history instead of hiding in a JSON field.
          node scripts/presets-summary.mjs presets.json

          # The trend across runs: uptime, failovers and latency per preset.
          if [ -s .lwc-history/presets.jsonl ]; then
            node src/cli.ts presets-history .lwc-history/presets.jsonl >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::At least one built-in endpoint is unhealthy; see the table above."
            exit "$status"
          fi

      # A healthy run can follow a flaky week, so the gate holds the recent
      # window to a minimum uptime and fails the job when a preset has been
      # below it. The same step publishes the week-over-week comparison, so a
      # provider change shows its delta without anyone asking for it. An empty
      # window or unreadable history fails too: neither can show the threshold
      # was met. `always()` keeps the outcome in the summary even when the probe
      # above already failed.
      - name: Check uptime over the window
        if: always()
        run: |
          node scripts/presets-gate.mjs .lwc-history/presets.jsonl \
            --since "$FAIL_WINDOW" \
            --max-age "$MAX_AGE" \
            --freshness-rows "$FRESHNESS_ROWS" \
            --compare "$COMPARE_WINDOW" \
            --fail-under "$FAIL_UNDER"

      # The archive job is the only one with write access, so the probe keeps
      # its read-only permissions. `always()` keeps a failed week in the record,
      # which is the week the next comparison most wants to see.
      - name: Upload the history for archiving
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preset-history
          path: .lwc-history/presets.jsonl
          if-no-files-found: ignore
          retention-days: 1

  archive:
    name: archive preset history
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Writing is confined to this job, and only to the release asset.
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Fetch the history from this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: preset-history
          path: .lwc-history

      - name: Publish the durable history
        run: |
          set -euo pipefail
          file=.lwc-history/presets.jsonl
          if [ ! -s "$file" ]; then
            echo "::warning::No history was produced; the release is unchanged."
            exit 0
          fi
          if ! gh release view preset-history >/dev/null 2>&1; then
            gh release create preset-history \
              --title "Preset health history" \
              --notes "Machine-managed history of the scheduled preset probe. The workflow rewrites presets.jsonl on every run; do not edit it here." \
              --latest=false
          fi
          # The file is already the union of the restored cache, the release and
          # this run, so publishing it cannot drop a run the release still has.
          gh release upload preset-history "$file" --clobber
          echo "published $(wc -l < "$file") runs"
