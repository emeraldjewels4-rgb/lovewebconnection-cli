name: Tests

# The test suite, separate from Migrations because that workflow only runs when
# migration, SQL or runner files change — the suite needs to run for every push.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      # `node --test` strips types without checking them, so a type error would
      # otherwise pass the suite and only surface at build time.
      - name: Typecheck
        run: npm run typecheck

      # Typecheck covers the dev tsconfig; this compiles tsconfig.build.json and
      # emits dist/, so a broken emit or a misconfigured outDir fails here. The
      # files asserted below are the entry points package.json declares.
      - name: Build
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.js
          test -f dist/cli.js
          test -f dist/index.d.ts

      # The browser test skips itself when it cannot find a Chromium-family
      # browser, so a broken image would pass the suite while checking nothing.
      # Install Chrome explicitly and name it for the test.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Check Chrome
        run: '"$CHROME_PATH" --version'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # The browser test runs in its own step, because a stuck Chrome would hold
      # the whole parallel suite open until the job timeout instead of failing.
      - name: Run the test suite
        run: |
          set -euo pipefail
          npm test | tee tests.log
          # Exactly one skip is allowed: the browser test, which runs below. Anything
          # else skipping means a check silently stopped checking — src/explorer-rpc
          # .test.mjs skips itself when the runner has no php, which is why this is an
          # exact count and not a substring match ("skipped 10" contains "skipped 1").
          if ! grep -qx "ℹ skipped 1" tests.log; then
            echo "::error::expected exactly 1 skipped test (the browser one); saw:"
            grep -E "^ℹ (tests|pass|fail|skipped|cancelled) " tests.log || true
            exit 1
          fi
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LWC_SKIP_BROWSER: "1"

      # Asserting a pass count matters as much as the skip count: a test that
      # skips itself still exits 0, so without these a broken browser would look
      # like a green step.
      - name: Browser test
        run: |
          set -euo pipefail
          timeout 180 node --test src/explorer-browser.test.ts | tee browser.log
          grep -qx "ℹ pass 1" browser.log || {
            echo "::error::the browser test did not pass; saw:"
            grep -E "^ℹ (tests|pass|fail|skipped) " browser.log || true
            exit 1
          }
          grep -qx "ℹ skipped 0" browser.log || {
            echo "::error::the browser test skipped itself instead of running; saw:"
            grep -E "^ℹ (tests|pass|fail|skipped) " browser.log || true
            exit 1
          }
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
