name: Tests

# The test suite, separate from Migrations because that workflow only runs when
# migration, SQL or runner files change — the suite needs to run for every push.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      # `node --test` strips types without checking them, so a type error would
      # otherwise pass the suite and only surface at build time.
      - name: Typecheck
        run: npm run typecheck

      # Typecheck covers the dev tsconfig; this compiles tsconfig.build.json and
      # emits dist/, so a broken emit or a misconfigured outDir fails here. The
      # files asserted below are the entry points package.json declares.
      - name: Build
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.js
          test -f dist/cli.js
          test -f dist/index.d.ts

      # The browser test skips itself when it cannot find a Chromium-family
      # browser, so a broken image would pass the suite while checking nothing.
      # Install Chrome explicitly and name it for the test.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Check Chrome
        run: '"$CHROME_PATH" --version'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # The browser test runs in its own step, because a stuck Chrome would hold
      # the whole parallel suite open until the job timeout instead of failing.
      - name: Run the test suite
        run: |
          set -euo pipefail
          npm test | tee tests.log
          # The browser test is skipped here and run below; nothing else may skip.
          grep -q "skipped 1" tests.log
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LWC_SKIP_BROWSER: "1"

      - name: Browser test
        run: |
          set -euo pipefail
          timeout 180 node --test src/explorer-browser.test.ts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
