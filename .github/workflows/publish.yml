name: Publish

# Publishes to npm with OIDC trusted publishing: no NPM_TOKEN secret exists.
# npm only accepts a publish when the GitHub repository, workflow file and
# environment match the trusted publisher configured on npmjs.com, so renaming
# this file or moving the repository requires updating that configuration too.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # mints the short-lived OIDC token npm exchanges for publish rights

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer; the runner's bundled npm
      # can lag behind. No token or registry auth is configured.
      - name: Use a current npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The browser test has its own workflow step in Tests; a release still
      # needs the offline suite, but Chrome is not installed on this runner.
      - name: Test
        run: LWC_SKIP_BROWSER=1 npm test

      - name: Build
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.js
          test -f dist/cli.js
          test -f dist/index.d.ts

      # A tag that disagrees with package.json would publish the wrong version
      # under the tag's name, so fail before npm sees it.
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
